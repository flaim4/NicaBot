name: .NET Core Build and Verify

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'

            - name: Restore dependencies
              run: dotnet restore SubBot.sln

            - name: Build project
              run: dotnet build SubBot.sln --configuration Release --no-restore
